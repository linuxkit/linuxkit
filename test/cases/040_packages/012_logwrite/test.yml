kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=ttyS0 console=ttyAMA0"
init:
  - linuxkit/init:f5f0c42b30c1b022fa4aa18cb4b980a8db43380d
  - linuxkit/runc:07fa3fb4f171d0875f6c4f2c19885f21d9480458
  - linuxkit/containerd:53d65b95f88c491660acc7be0989f715cfb1adbe
  - linuxkit/ca-certificates:7c48a44e9eddcc175d1d082b3ea7572f34f29637
  - linuxkit/memlogd:4c2755160e29a7d0efad2a58f2f3eaec5bd22c49
services:
# A service which generates logs of log messages
  - name: fill-the-logs
    image: alpine
    command: ["/bin/sh", "-c", "while /bin/true; do echo hello $(date); done" ]
  - name: write-and-rotate-logs
    image: linuxkit/logwrite:fa71ed9e92813f6d11edfd4e2da662340b777614
    command: ["/usr/bin/logwrite", "-max-log-size", "1024"]
  - name: check-the-logs
    image: alpine:3.21
    binds:
      - /check.sh:/check.sh
      - /dev/console:/dev/console
      - /var/log:/var/log
    devices:
      - path: "/dev/console"
        type: c
        major: 5
        minor: 1
        mode: "0666"
    command: ["sh", "./check.sh"]
    pid: host
    capabilities:
      - CAP_SYS_BOOT
files:
  - path: check.sh
    source: ./check.sh
