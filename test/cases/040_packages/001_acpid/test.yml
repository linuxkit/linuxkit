kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=ttyS0 console=ttyAMA0 console=hvc0 linuxkit.runc_console=1"
init:
  - linuxkit/init:24f9f554ed98f452fd940f5cff7f2ae1887e9974
  - linuxkit/runc:07fa3fb4f171d0875f6c4f2c19885f21d9480458
onboot:
  - name: acpid-test
    image: linuxkit/acpid:0365c328b2a986bd4d33ced58372ef1e674238e7
    pid: host
    binds:
      - /check.sh:/check.sh:ro
    command: ["/bin/sh", "/check.sh"]
files:
  - path: check.sh
    source: ./check.sh
