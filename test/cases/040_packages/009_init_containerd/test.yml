kernel:
  image: linuxkit/kernel:6.12.59
  cmdline: "console=ttyS0 console=ttyAMA0"
init:
  - linuxkit/init:6493bbf945d124ffbd51b5db15377d997a05469e
  - linuxkit/runc:9442aa234715e751a16144f1d4ae3fd1a00fd492
  - linuxkit/containerd:eb5daf20704109ea58abb38d2b808e0c3a7e3717
  - linuxkit/ca-certificates:695574301bd08dda987dccb31e384f7fab3c5c05
services:
  - name: test
    image: alpine:3.13
    pid: host
    binds:
      - /check.sh:/check.sh
      - /dev/console:/dev/console
    devices:
      - path: "/dev/console"
        type: c
        major: 5
        minor: 1
        mode: "0666"
    capabilities:
      - CAP_SYS_BOOT
    command: ["sh", "/check.sh"]
files:
  - path: check.sh
    source: ./check.sh
  - path: /etc/containerd/runtime-config.toml
    source: ./runtime-config.toml
