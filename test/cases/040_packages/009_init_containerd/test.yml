kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=ttyS0 console=ttyAMA0"
init:
  - linuxkit/init:a25466b2cbe4832655d5b0fa5dff5d3a027c5eca
  - linuxkit/runc:9442aa234715e751a16144f1d4ae3fd1a00fd492
  - linuxkit/containerd:7d051385e195aa413b9dd0481d069512d91dcd14
  - linuxkit/ca-certificates:695574301bd08dda987dccb31e384f7fab3c5c05
services:
  - name: test
    image: alpine:3.13
    pid: host
    binds:
      - /check.sh:/check.sh
      - /dev/console:/dev/console
    devices:
      - path: "/dev/console"
        type: c
        major: 5
        minor: 1
        mode: "0666"
    capabilities:
      - CAP_SYS_BOOT
    command: ["sh", "/check.sh"]
files:
  - path: check.sh
    source: ./check.sh
  - path: /etc/containerd/runtime-config.toml
    source: ./runtime-config.toml
