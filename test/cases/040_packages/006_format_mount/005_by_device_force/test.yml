kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=ttyS0 console=ttyAMA0"
init:
  - linuxkit/init:f5f0c42b30c1b022fa4aa18cb4b980a8db43380d
  - linuxkit/runc:07fa3fb4f171d0875f6c4f2c19885f21d9480458
onboot:
  - name: format
    image: linuxkit/format:f63474a52d61d03e7a67c5e899c491b3b2b8e5d2
    command: ["/usr/bin/format", "-verbose", "-type", "ext4", "/dev/sda"]
  - name: format
    image: linuxkit/format:f63474a52d61d03e7a67c5e899c491b3b2b8e5d2
    command: ["/usr/bin/format", "-verbose", "-type", "ext4", "/dev/sdb"]
  - name: format
    image: linuxkit/format:f63474a52d61d03e7a67c5e899c491b3b2b8e5d2
    command: ["/usr/bin/format", "-verbose", "-type", "xfs", "/dev/sda"]
  - name: format
    image: linuxkit/format:f63474a52d61d03e7a67c5e899c491b3b2b8e5d2
    command: ["/usr/bin/format", "-verbose", "-force", "-type", "xfs", "/dev/sdb"]
  - name: test
    image: linuxkit/format:f63474a52d61d03e7a67c5e899c491b3b2b8e5d2
    binds:
      - /check.sh:/check.sh
    command: ["sh", "./check.sh"]
    capabilities:
      - CAP_SYS_ADMIN
      - CAP_MKNOD
  - name: poweroff
    image: linuxkit/poweroff:d931fc5ebd8cf0dc13d3c2e64b65ddf5caa7cf31
    command: ["/bin/sh", "/poweroff.sh", "10"]
files:
  - path: check.sh
    source: ./check.sh
