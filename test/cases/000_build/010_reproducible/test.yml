# NOTE: Images build from this file likely do not run
kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=ttyS0"
init:
  - linuxkit/init:f5f0c42b30c1b022fa4aa18cb4b980a8db43380d
  - linuxkit/runc:07fa3fb4f171d0875f6c4f2c19885f21d9480458
  - linuxkit/containerd:53d65b95f88c491660acc7be0989f715cfb1adbe

onboot:
  - name: dhcpcd
    image: linuxkit/dhcpcd:90b68ee3ed01e747b2bfc88cde1941c3420d271c
    command: ["/sbin/dhcpcd", "--nobackground", "-f", "/dhcpcd.conf", "-1"]
    # Add some random unsorted caps
    capabilities:
      - CAP_SETGID
      - CAP_DAC_OVERRIDE

services:
  - name: testservice
    image: linuxkit/ip:ee048a0a458f5d36daa312f7167e0445d7617e6d
    # Some environments
    env:
      - BENV=true
      - ARANDOMENV=foobar
    # Some mounts
    mounts:
      - type: cgroup
        options: ["rw","nosuid","noexec","nodev","relatime"]
      - type: overlay
        source: overlay
        destination: writeable-host-etc
        options: ["rw", "lowerdir=/etc", "upperdir=/run/hostetc/upper", "workdir=/run/hostetc/work"]
    # Some binds
    binds:
      - /var/run:/var/run
      - /foobar:/foobar
      - /etc/foobar:/etc/foobar
      - /etc/aaa:/etc/aaa
    # And some runtime settings
    runtime:
      mkdir: ["/var/lib/docker","/var/lib/aaa"]

files:
  - path: etc/linuxkit-config
    metadata: yaml
