kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=ttyS0 console=ttyAMA0"
init:
  - linuxkit/init:24f9f554ed98f452fd940f5cff7f2ae1887e9974
  - linuxkit/runc:07fa3fb4f171d0875f6c4f2c19885f21d9480458
onboot:
  - name: mount
    image: linuxkit/mount:518c5fc8a838bfe34d24f91fac2cb7855e7a9545
    binds.add:
      - /check.sh:/check.sh
      - /var/tmp:/var/tmp
    # default binds from linuxkit/mount
    # - /dev:/dev
    # - /var:/var:rshared,rbind
    # - /:/hostroot
    command: ["sh", "-c", "/check.sh"]
  - name: poweroff
    image: linuxkit/poweroff:d931fc5ebd8cf0dc13d3c2e64b65ddf5caa7cf31
    command: ["/bin/sh", "/poweroff.sh", "10"]
files:
  - path: check.sh
    source: ./check.sh
    mode: "0700"
