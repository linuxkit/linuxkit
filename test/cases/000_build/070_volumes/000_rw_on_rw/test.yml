kernel:
  image: linuxkit/kernel:6.12.59
  cmdline: "console=ttyS0 console=ttyAMA0"
init:
  - linuxkit/init:1c3e4933ceabd7418b961d66d5d884bf0044ac64
  - linuxkit/runc:9442aa234715e751a16144f1d4ae3fd1a00fd492
onboot:
  - name: test1
    image: alpine:3.20
    binds:
      - /write.sh:/write.sh
      - vola:/vola
    command: ["sh", "-c", "/write.sh"]
  - name: test2
    image: alpine:3.20
    binds:
      - /check.sh:/check.sh
      - vola:/vola
    command: ["sh", "-c", "/check.sh"]
  - name: poweroff
    image: linuxkit/poweroff:4059858a555bed90c2280fa9b060b7a8f8de6d45
    command: ["/bin/sh", "/poweroff.sh", "10"]
volumes:
  - name: vola
files:
  - path: check.sh
    source: ./check.sh
    mode: "0700"
  - path: write.sh
    source: ./write.sh
    mode: "0700"
