# FIXME: This should use the minimal example
# We continue to use the kernel-config-test as CI is currently expecting to see a success message
kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=ttyS0"
init:
  - linuxkit/init:f5f0c42b30c1b022fa4aa18cb4b980a8db43380d
  - linuxkit/runc:07fa3fb4f171d0875f6c4f2c19885f21d9480458
  - linuxkit/containerd:53d65b95f88c491660acc7be0989f715cfb1adbe
onboot:
  - name: dhcpcd
    image: linuxkit/dhcpcd:90b68ee3ed01e747b2bfc88cde1941c3420d271c
    command: ["/sbin/dhcpcd", "--nobackground", "-f", "/dhcpcd.conf", "-1"]
  - name: check-kernel-config
    image: linuxkit/test-kernel-config:a927cc1dda5ab717db8d6da5df2d2199538ad479
  - name: poweroff
    image: linuxkit/poweroff:d931fc5ebd8cf0dc13d3c2e64b65ddf5caa7cf31
    command: ["/bin/sh", "/poweroff.sh", "120"]
