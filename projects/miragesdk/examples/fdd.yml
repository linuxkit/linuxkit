kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=ttyS0 page_poison=1"
init:
  - linuxkit/init:24f9f554ed98f452fd940f5cff7f2ae1887e9974
  - linuxkit/runc:07fa3fb4f171d0875f6c4f2c19885f21d9480458
  - linuxkit/containerd:8fa43851eee502729167a8033c69af278f0bf1e3
  - linuxkit/ca-certificates:7c48a44e9eddcc175d1d082b3ea7572f34f29637
  - samoht/fdd
onboot:
  - name: sysctl
    image: linuxkit/sysctl:e24d301343e31e2c477a1b07e504192dcdf5b700
services:
  - name: getty
    image: linuxkit/getty:acf4c09396ac91c060abe0ccfe35122decb45121
    env:
     - INSECURE=true
  - name: rngd
    image: linuxkit/rngd:49e0dafc1a40a4dcc82f4c992eb99b0dec7ebd4b
  - name: dhcpcd
    image: linuxkit/dhcpcd:90b68ee3ed01e747b2bfc88cde1941c3420d271c
files:
  - path: etc/init.d/020-fdd-init
    mode: "0700"
    contents: |
      #!/bin/sh
      /bin/fdd init -vv -s /run/fdd.sock
  - path: etc/init.d/030-fdd-share
    mode: "0700"
    contents: |
      #!/bin/sh
      /bin/fdd share -vv -s /run/fdd.sock /tmp/channel-net-eng &&
      /bin/fdd share -vv -s /run/fdd.sock /tmp/channel-conf-net &&
      /bin/fdd share -vv -s /run/fdd.sock /tmp/channel-conf-act
trust:
  org:
    - linuxkit
