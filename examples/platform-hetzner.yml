kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: console=ttyS1
  ucode: intel-ucode.cpio
init:
  - linuxkit/init:a25466b2cbe4832655d5b0fa5dff5d3a027c5eca
  - linuxkit/runc:9442aa234715e751a16144f1d4ae3fd1a00fd492
  - linuxkit/containerd:7d051385e195aa413b9dd0481d069512d91dcd14
  - linuxkit/ca-certificates:695574301bd08dda987dccb31e384f7fab3c5c05
  - linuxkit/firmware:68c2b29f28f2639020b9f8d55254d333498a30aa
onboot:
  - name: rngd1
    image: linuxkit/rngd:984eb580ecb63986f07f626b61692a97aacd7198
    command: ["/sbin/rngd", "-1"]
  - name: sysctl
    image: linuxkit/sysctl:43ac1d39da329c3567fcb9689e5ca99de6d169b6
  - name: dhcpcd
    image: linuxkit/dhcpcd:b87e9ececac55a65eaa592f4dd8b4e0c3009afdb
    command: ["/sbin/dhcpcd", "--nobackground", "-f", "/dhcpcd.conf", "-1"]
  - name: metadata
    image: linuxkit/metadata:4bbf406678d376e1ae9c9efae6ca2421f63fb4ff
    command: ["/usr/bin/metadata", "hetzner"]
services:
  - name: rngd
    image: linuxkit/rngd:984eb580ecb63986f07f626b61692a97aacd7198
  - name: getty
    image: linuxkit/getty:aa13700731c4348c7a9b914f03a57f345d7f5ace
    env:
     - INSECURE=true
  - name: sshd
    image: linuxkit/sshd:08e5d4a46603eff485d5d1b14001cc932a530858
    binds.add:
      - /root/.ssh:/root/.ssh
files:
  - path: root/.ssh/authorized_keys
    source: ~/.ssh/id_rsa.pub
    mode: "0600"
    optional: true
