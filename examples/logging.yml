# Simple example of using an external logging service
kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=tty0 console=ttyS0 console=ttyAMA0"
init:
  - linuxkit/init:24f9f554ed98f452fd940f5cff7f2ae1887e9974
  - linuxkit/runc:07fa3fb4f171d0875f6c4f2c19885f21d9480458
  - linuxkit/containerd:8fa43851eee502729167a8033c69af278f0bf1e3
  - linuxkit/ca-certificates:7c48a44e9eddcc175d1d082b3ea7572f34f29637
  - linuxkit/memlogd:4c2755160e29a7d0efad2a58f2f3eaec5bd22c49
onboot:
  - name: sysctl
    image: linuxkit/sysctl:e24d301343e31e2c477a1b07e504192dcdf5b700
  - name: dhcpcd
    image: linuxkit/dhcpcd:90b68ee3ed01e747b2bfc88cde1941c3420d271c
    command: ["/sbin/dhcpcd", "--nobackground", "-f", "/dhcpcd.conf", "-1"]
services:
# Inside the getty type `/proc/1/root/usr/bin/logread -F` to follow the log
  - name: getty
    image: linuxkit/getty:acf4c09396ac91c060abe0ccfe35122decb45121
    env:
     - INSECURE=true
# A service which generates log messages for testing
  - name: write-to-the-logs
    image: alpine:3.13
    command: ["/bin/sh", "-c", "while /bin/true; do echo hello $(date); sleep 1; done" ]
  - name: write-and-rotate-logs
    image: linuxkit/logwrite:fa71ed9e92813f6d11edfd4e2da662340b777614
  - name: kmsg
    image: linuxkit/kmsg:b849691363b8a17e11c41698c4468091b7b68c5f
