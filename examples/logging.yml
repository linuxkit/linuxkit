# Simple example of using an external logging service
kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=tty0 console=ttyS0 console=ttyAMA0"
init:
  - linuxkit/init:a25466b2cbe4832655d5b0fa5dff5d3a027c5eca
  - linuxkit/runc:9442aa234715e751a16144f1d4ae3fd1a00fd492
  - linuxkit/containerd:7d051385e195aa413b9dd0481d069512d91dcd14
  - linuxkit/ca-certificates:695574301bd08dda987dccb31e384f7fab3c5c05
  - linuxkit/memlogd:19b0fdec83dded95e0a2f97a8ca6868f5e83c401
onboot:
  - name: sysctl
    image: linuxkit/sysctl:43ac1d39da329c3567fcb9689e5ca99de6d169b6
  - name: dhcpcd
    image: linuxkit/dhcpcd:b87e9ececac55a65eaa592f4dd8b4e0c3009afdb
    command: ["/sbin/dhcpcd", "--nobackground", "-f", "/dhcpcd.conf", "-1"]
services:
# Inside the getty type `/proc/1/root/usr/bin/logread -F` to follow the log
  - name: getty
    image: linuxkit/getty:aa13700731c4348c7a9b914f03a57f345d7f5ace
    env:
     - INSECURE=true
# A service which generates log messages for testing
  - name: write-to-the-logs
    image: alpine:3.13
    command: ["/bin/sh", "-c", "while /bin/true; do echo hello $(date); sleep 1; done" ]
  - name: write-and-rotate-logs
    image: linuxkit/logwrite:24e6a76c2d45a7679d4f53db9ea377373b543dc7
  - name: kmsg
    image: linuxkit/kmsg:c4d8d509cf496faa21c184ae7fdff6fddc6e186d
