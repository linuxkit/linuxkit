kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=ttyS0"
init:
  - linuxkit/init:f5f0c42b30c1b022fa4aa18cb4b980a8db43380d
  - linuxkit/runc:07fa3fb4f171d0875f6c4f2c19885f21d9480458
  - linuxkit/containerd:53d65b95f88c491660acc7be0989f715cfb1adbe
onboot:
  - name: dhcpcd
    image: linuxkit/dhcpcd:90b68ee3ed01e747b2bfc88cde1941c3420d271c
    command: ["/sbin/dhcpcd", "--nobackground", "-f", "/dhcpcd.conf", "-1"]
  - name: mount-vpnkit
    image: alpine:3.13
    binds:
        - /var/:/host_var:rbind,rshared
    capabilities:
        - CAP_SYS_ADMIN
    rootfsPropagation: shared
    command: ["sh", "-c", "mkdir /host_var/vpnkit && mount -v -t 9p -o trans=virtio,dfltuid=1001,dfltgid=50,version=9p2000 port /host_var/vpnkit"]
services:
  - name: sshd
    image: linuxkit/sshd:4251ab3ea721a1a6165a0f6354d613efd052bb04
    binds.add:
      - /root/.ssh:/root/.ssh
  - name: vpnkit-forwarder
    image: linuxkit/vpnkit-forwarder:a5a32402621f1b3213e16d4aea37203307d4d5c0
    binds:
        - /var/vpnkit:/port
    net: host
    command: ["/vpnkit-forwarder"]

files:
  - path: root/.ssh/authorized_keys
    source: ~/.ssh/id_rsa.pub
    mode: "0600"
    optional: true
