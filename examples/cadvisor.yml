kernel:
  image: linuxkit/kernel:6.18.60
  cmdline: "console=tty0 console=ttyS0 console=ttyAMA0 console=ttysclp0"
init:
  - linuxkit/init:24f9f554ed98f452fd940f5cff7f2ae1887e9974
  - linuxkit/runc:07fa3fb4f171d0875f6c4f2c19885f21d9480458
  - linuxkit/containerd:8fa43851eee502729167a8033c69af278f0bf1e3
  - linuxkit/ca-certificates:7c48a44e9eddcc175d1d082b3ea7572f34f29637
onboot:
  - name: sysctl
    image: linuxkit/sysctl:e24d301343e31e2c477a1b07e504192dcdf5b700
  - name: dhcpcd
    image: linuxkit/dhcpcd:90b68ee3ed01e747b2bfc88cde1941c3420d271c
    command: ["/sbin/dhcpcd", "--nobackground", "-f", "/dhcpcd.conf", "-1"]
  - name: sysfs
    image: linuxkit/sysfs:2622f44c10392f53527761cd09893b3c034b25a8
  - name: format
    image: linuxkit/format:f63474a52d61d03e7a67c5e899c491b3b2b8e5d2
  - name: mount
    image: linuxkit/mount:518c5fc8a838bfe34d24f91fac2cb7855e7a9545
    command: ["/usr/bin/mountie", "/var/lib/docker"]

services:
  - name: getty
    image: linuxkit/getty:acf4c09396ac91c060abe0ccfe35122decb45121
    env:
      - INSECURE=true
  - name: rngd
    image: linuxkit/rngd:49e0dafc1a40a4dcc82f4c992eb99b0dec7ebd4b
  - name: ntpd
    image: linuxkit/openntpd:40491f09f06bb3a7e048a3078a963009266c729a

  - name: docker
    image: docker:20.10.6-dind
    capabilities:
      - all
    net: host
    mounts:
      - type: cgroup
        options: ["rw", "nosuid", "noexec", "nodev", "relatime"]
    binds:
      - /etc/resolv.conf:/etc/resolv.conf
      - /var/lib/docker:/var/lib/docker
      - /var/run:/var/run
      - /lib/modules:/lib/modules
      - /etc/docker/daemon.json:/etc/docker/daemon.json
    command: ["/usr/local/bin/docker-init", "/usr/local/bin/dockerd"]
  - name: cadvisor
    image: linuxkit/cadvisor:7cc0856536f1db7cdbf10e0cd616d7dcf2e2ea21
files:
  - path: var/lib/docker
    directory: true
  - path: etc/docker/daemon.json
    contents: '{"debug": true, "hosts": ["unix:///var/run/docker.sock"]}'
    mode: "0644"
